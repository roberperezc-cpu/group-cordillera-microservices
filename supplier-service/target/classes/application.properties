server.port=8086
spring.application.name=supplier-service


#spring.datasource.url=jdbc:mysql://localhost:3306/db_cordillera_sales?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.url=jdbc:mysql://host.docker.internal:3306/db_cordillera_sales?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=


spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update


spring.flyway.enabled=false

spring.web.error.include-message=always
spring.web.error.include-binding-errors=always
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.client.serviceUrl.defaultZone=http://eureka-server:8761/eureka/
eureka.client.eureka-server-http-client-name=RestClient