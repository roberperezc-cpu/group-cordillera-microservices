spring.application.name=inventory-service
server.port=8082


spring.datasource.url=jdbc:mysql://localhost:3306/db_cordillera_sales?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.flyway.enabled=false

spring.web.error.include-message=always
spring.web.error.include-binding-errors=always
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.eureka-server-http-client-name=RestClient